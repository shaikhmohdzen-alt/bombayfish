<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Account & Order Tracking - Bombayfish</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <a href="index.html" class="logo">🐟 Bombay<span>fish</span></a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="products.html">Fish Market</a>
        <a href="about.html">About & Field Study</a>
      </div>
    </nav>
  </header>

  <div class="container" style="margin-top: 30px;">
    <div class="section-title">
      <h2>My Account & Order Tracking</h2>
      <p>View active fish deliveries and order history</p>
    </div>

    <!-- Active Orders Card -->
    <div style="background: white; padding: 30px; border-radius: var(--radius); border: 1px solid var(--border-color); box-shadow: var(--shadow-md); margin-bottom: 30px;">
      <h3 style="color: var(--deep-charcoal); margin-bottom: 18px;">Recent Orders</h3>
      <div id="userOrdersContainer">Connecting to live orders database...</div>
    </div>
  </div>

  <!-- Firebase SDK Libraries -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="script.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById("userOrdersContainer");

      if (typeof database !== 'undefined') {
        database.ref('orders').on('value', (snapshot) => {
          const data = snapshot.val();
          if (!data) {
            container.innerHTML = "<p style='color:var(--text-muted);'>No active orders found for this account.</p>";
            return;
          }

          const orderKeys = Object.keys(data).reverse();
          container.innerHTML = orderKeys.map(key => {
            const o = data[key];
            return `
              <div style="border-bottom: 1px solid var(--border-color); padding: 16px 0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
                <div>
                  <strong style="color:var(--deep-charcoal);">Order ID: ${o.orderId}</strong> <small style="color:var(--text-muted);">(${o.date || 'Today'})</small><br>
                  <span>Total Amount: <strong style="color:var(--electric-indigo);">₹${o.totalAmount}</strong></span> |
                  <span>Method: ${o.deliveryMethod}</span>
                </div>
                <div>
                  <span style="padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; background: var(--aqua-tint); color: var(--vivid-cyan); border: 1px solid rgba(6, 182, 212, 0.2);">
                    Status: ${o.status}
                  </span>
                </div>
              </div>
            `;
          }).join('');
        });
      }
    });
  </script>
</body>
</html>
