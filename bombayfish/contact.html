<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Bombayfish</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <a href="index.html" class="logo">🐟 Bombay<span>fish</span></a>
    </nav>
  </header>

  <div class="container" style="max-width: 840px; margin-top: 30px;">
    <div class="section-title">
      <h2>Contact & Market Location</h2>
      <p>Have questions about our college field study project?</p>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 28px;">
      <div style="background: white; padding: 28px; border-radius: var(--radius); border: 1px solid var(--border-color); box-shadow: var(--shadow-md);">
        <h3 style="color: var(--deep-charcoal); margin-bottom: 16px;">Market Station</h3>
        <p style="margin-bottom: 10px;"><strong>Location:</strong> Local Dock Market Counter </p>
        <p style="margin-bottom: 10px;"><strong>Business Hours:</strong> 6:00 AM - 2:00 PM </p>
        <p style="margin-bottom: 10px;"><strong>Phone/WhatsApp:</strong> +91 998700000</p>
        <p><strong>Email:</strong> project.info@bombayfish-demo.edu</p>
      </div>

      <form style="background: white; padding: 28px; border-radius: var(--radius); border: 1px solid var(--border-color); box-shadow: var(--shadow-md);" onsubmit="event.preventDefault(); alert('Message submitted successfully!');">
        <h3 style="color: var(--deep-charcoal); margin-bottom: 16px;">Send Inquiry</h3>
        <div class="form-group">
          <label>Your Name</label>
          <input type="text" required placeholder="Enter name">
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" required placeholder="Enter email">
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea rows="3" required placeholder="Enter message"></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Message</button>
      </form>
    </div>
  </div>
</body>
</html>
